    <style>
      body {
        background-color: #050B18;
        color: #E2E8F0;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      
      .bg-carbon {
        background-color: #050B18;
        background-image: 
          radial-gradient(at 50% 0%, rgba(0, 102, 255, 0.22) 0px, transparent 75%),
          radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
        background-size: 100% 100%, 100% 100%;
      }

      .text-gradient-blue {
        background: linear-gradient(135deg, #FFFFFF 0%, #60A5FA 50%, #00D2FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-gradient-gold {
        background: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .blue-glow-box {
        box-shadow: 0 0 30px rgba(0, 102, 255, 0.25);
      }

      .green-glow-btn {
        box-shadow: 0 0 25px rgba(37, 211, 102, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      .green-glow-btn:hover {
        box-shadow: 0 0 40px rgba(37, 211, 102, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #030814;
      }
      ::-webkit-scrollbar-thumb {
        background: #1C3574;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0066FF;
      }
